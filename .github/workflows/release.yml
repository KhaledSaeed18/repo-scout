name: Release

# Pushing a vX.Y.Z tag publishes a GitHub release. Running the workflow by
# hand is a dry run: it builds every artifact the same way and keeps them as a
# workflow artifact, publishing nothing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version whose CHANGELOG.md section becomes the notes, such as 1.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ github.event_name == 'push' && 'Publish' || 'Dry run' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign build provenance
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: scripts/release-notes.sh "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Set up syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Run tests
        run: go test ./...

      - name: Build and publish
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build only
        if: github.event_name != 'push'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --release-notes ${{ runner.temp }}/notes.md

      - name: Smoke test the Linux binary
        run: |
          tar -xzf dist/repo-scout_*_linux_amd64.tar.gz -C "$RUNNER_TEMP" repo-scout
          "$RUNNER_TEMP/repo-scout" version
          REPO_SCOUT_DB="$RUNNER_TEMP/smoke.db" "$RUNNER_TEMP/repo-scout" serve &
          for _ in $(seq 1 20); do curl -fs http://127.0.0.1:8080/api/health && break; sleep 0.5; done
          curl -fs http://127.0.0.1:8080/ | grep -q '<div id="root">'

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Keep the dry run's artifacts
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/checksums.txt
            ${{ runner.temp }}/notes.md
          retention-days: 7
