# Weekly, grouped dependency updates. Minor and patch updates arrive as one
# pull request per ecosystem; major updates come one by one to be reviewed.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Types must match the Node version we run on (22, see ci.yml), not the
      # newest one; they move with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci(deps)

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node moves to a new LTS deliberately: odd releases are short-lived and
      # Node 25 dropped the corepack the image build uses.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build(deps)
