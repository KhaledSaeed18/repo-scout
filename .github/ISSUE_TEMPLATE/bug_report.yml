name: Bug report
description: Something is broken, wrong, or crashes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems must not be filed here; use a [private report](https://github.com/KhaledSaeed18/repo-scout/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message shown in the app.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Scan a repository with ...
        2. Open the Architecture page
        3. Choose "Files"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Scanning or the Repositories page
        - Overview or Portfolio
        - History (Activity, Commits, Contributors, Knowledge, Branches & tags)
        - Files or Search
        - Metrics, Hotspots or Duplicates
        - Architecture, Change coupling or Dependencies
        - Settings
        - Command line (repo-scout scan, reports, quality gates)
        - Installing, upgrading or running
        - Something else
    validations:
      required: true
  - type: textarea
    id: repository
    attributes:
      label: The repository you scanned
      description: A public link if you can share it, or its shape (number of files, main languages, how long the history is, monorepo or not).
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Repo Scout version
      description: Output of `repo-scout version`, or `git rev-parse --short HEAD` if you built from source.
      placeholder: repo-scout 1.0.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Release binary
        - go install (command line only)
        - Built from source
        - Container built from the Dockerfile
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15 on Apple silicon, Chrome 140, Git 2.51
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The server's terminal output (`REPO_SCOUT_LOG_LEVEL=debug` adds detail) or browser console errors, if any.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: It still happens on the latest release.
          required: false
