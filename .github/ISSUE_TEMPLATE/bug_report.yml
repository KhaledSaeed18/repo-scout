name: Bug report
description: Something is broken, wrong, or crashes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems must not be filed here; use a [private report](https://github.com/KhaledSaeed18/repo-scout/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message shown in the app.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Scan a repository with ...
        2. Open the Architecture page
        3. Choose "Files"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Scanning or the Repositories page
        - Overview
        - History (Activity, Commits, Contributors, Branches & tags)
        - Files or Search
        - Metrics or Duplicates
        - Architecture or Dependencies
        - Settings
        - Installing, building or running
        - Something else
    validations:
      required: true
  - type: textarea
    id: repository
    attributes:
      label: The repository you scanned
      description: A public link if you can share it, or its shape (number of files, main languages, how long the history is, monorepo or not).
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Repo Scout commit
      description: Output of `git rev-parse --short HEAD` in your Repo Scout checkout.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Chrome 140, Go 1.26, Node 22
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: API terminal output or browser console errors, if any.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: It still happens on the latest `main`.
          required: false
